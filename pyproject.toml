[project]
name = "comfyui-skintokens-noblender"
version = "0.0.1"
description = "Auto-rig a static mesh into a skinned .glb (skeleton + weights) - pure Python, no Blender."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
# Runtime deps are tracked in requirements.txt (ComfyUI Manager reads that).
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/stevelittlefish/ComfyUI-SkinTokens-NoBlender"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["skintokens*"]

[tool.setuptools.package-data]
"skintokens.vendor" = ["configs/skeleton/*.yaml"]

# --- ComfyUI Manager / registry metadata ---
[tool.comfy]
PublisherId = "stevelittlefish"
DisplayName = "ComfyUI-SkinTokens-NoBlender"
Icon = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "server: tests that need the GPU + full model weights (run on the server; see scripts/server/)",
]
